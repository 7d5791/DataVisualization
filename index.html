<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeReMi Viz | Análisis Interactivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .filter-chip {
            transition: all 0.2s ease;
            cursor: pointer;
            user-select: none;
        }
        .filter-chip.active {
            background-color: #0ea5e9;
            color: white;
            border-color: #0ea5e9;
        }
    </style>
</head>
<body class="bg-slate-50">

    <nav class="bg-white border-b">
        <div class="max-w-screen-2xl mx-auto px-8 py-4">
            <span class="font-semibold text-2xl">VeReMi Viz</span>
        </div>
    </nav>

    <div class="max-w-screen-2xl mx-auto px-8 pt-8 pb-4">
        <h1 class="text-4xl font-bold tracking-tight">Explorador de Ataques en VANETs</h1>
        <p class="text-slate-600 mt-2">Usa los filtros para explorar los datos interactivamente.</p>
    </div>

    <!-- FILTROS -->
    <div class="max-w-screen-2xl mx-auto px-8">
        <div class="bg-white border rounded-3xl p-6 mb-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-semibold">Filtros</h3>
                <button onclick="resetAllFilters()"
                        class="text-sm px-4 py-2 border rounded-2xl hover:bg-slate-100 flex items-center gap-x-2">
                    <i class="fa-solid fa-undo"></i>
                    <span>Resetear todo</span>
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

                <!-- Scenario -->
                <div>
                    <label class="text-sm font-semibold text-slate-600 block mb-2">Escenario</label>
                    <div id="filter-scenario" class="flex flex-wrap gap-2"></div>
                </div>

                <!-- Density -->
                <div>
                    <label class="text-sm font-semibold text-slate-600 block mb-2">Densidad</label>
                    <div id="filter-density" class="flex flex-wrap gap-2"></div>
                </div>

                <!-- Attack Type -->
                <div>
                    <label class="text-sm font-semibold text-slate-600 block mb-2">Tipo de Ataque</label>
                    <div id="filter-attack-type" class="flex flex-wrap gap-2 max-h-24 overflow-auto"></div>
                </div>

            </div>
        </div>

        <!-- VISUALIZACIONES -->
        <div class="grid lg:grid-cols-12 gap-6">

            <!-- Mapa -->
            <div class="lg:col-span-7 bg-white border rounded-3xl p-5">
                <h3 class="font-semibold mb-3">Distribución Espacial</h3>
                <div id="main-map" style="height: 480px;"></div>
            </div>

            <!-- Estadísticas + Distribución -->
            <div class="lg:col-span-5 space-y-6">
                <div class="bg-white border rounded-3xl p-5">
                    <h3 class="font-semibold mb-4">Estadísticas</h3>
                    <div id="stats" class="grid grid-cols-3 gap-4"></div>
                </div>

                <div class="bg-white border rounded-3xl p-5">
                    <h3 class="font-semibold mb-3">Mensajes por Tipo de Ataque</h3>
                    <div id="attack-chart" style="height: 220px;"></div>
                </div>
            </div>

            <!-- Trayectorias -->
            <div class="lg:col-span-12 bg-white border rounded-3xl p-5">
                <div class="mb-4">
                    <label class="font-semibold">Ver Trayectoria de un Vehículo</label>
                    <select id="sender-select" class="mt-2 w-full border rounded-2xl px-4 py-3" onchange="showTrajectory()">
                        <option value="">-- Selecciona un vehículo --</option>
                    </select>
                </div>
                <div id="trajectory-chart" style="height: 380px;"></div>
            </div>

        </div>
    </div>

    <script>
        let fullData = [];
        let filteredData = [];

        async function loadData() {
            const res = await fetch('sample_data.json');
            fullData = await res.json();
            filteredData = [...fullData];

            initFilters();
            updateAllCharts();
            populateVehicleSelector();
        }

        function createChip(text, type) {
            const chip = document.createElement('div');
            chip.className = `px-3 py-1 text-xs border rounded-2xl filter-chip active`;
            chip.textContent = text;
            chip.dataset.type = type;
            chip.dataset.value = text;

            chip.onclick = () => {
                chip.classList.toggle('active');
                chip.style.backgroundColor = chip.classList.contains('active') ? '#0ea5e9' : '';
                chip.style.color = chip.classList.contains('active') ? 'white' : '';
                applyFilters();
            };
            return chip;
        }

        function initFilters() {
            // Scenario
            const sDiv = document.getElementById('filter-scenario');
            [...new Set(fullData.map(d => d.scenario_type))].forEach(v => {
                sDiv.appendChild(createChip(v, 'scenario_type'));
            });

            // Density
            const dDiv = document.getElementById('filter-density');
            [...new Set(fullData.map(d => d.density))].forEach(v => {
                dDiv.appendChild(createChip(v, 'density'));
            });

            // Attack Type
            const aDiv = document.getElementById('filter-attack-type');
            [...new Set(fullData.map(d => d.attack_type))].forEach(v => {
                aDiv.appendChild(createChip(v, 'attack_type'));
            });
        }

        function applyFilters() {
            const activeChips = document.querySelectorAll('.filter-chip.active');

            let result = fullData;

            activeChips.forEach(chip => {
                const type = chip.dataset.type;
                const value = chip.dataset.value;
                result = result.filter(item => item[type] === value);
            });

            filteredData = result;
            updateAllCharts();
        }

        function resetAllFilters() {
            document.querySelectorAll('.filter-chip').forEach(chip => {
                chip.classList.add('active');
                chip.style.backgroundColor = '#0ea5e9';
                chip.style.color = 'white';
            });
            filteredData = [...fullData];
            updateAllCharts();
        }

        function updateAllCharts() {
            createMap();
            updateStats();
            updateAttackChart();
        }

        function createMap() {
            const data = filteredData.length > 0 ? filteredData : fullData;

            const trace = {
                x: data.map(d => d.pos_x),
                y: data.map(d => d.pos_y),
                mode: 'markers',
                type: 'scatter',
                marker: {
                    color: data.map(d => d.attack_label === "Ataque" ? '#E63946' : '#2E86AB'),
                    size: 5,
                    opacity: 0.7
                },
                text: data.map(d => `${d.sender} | ${d.attack_type}<br>Latencia: ${d.latency?.toFixed(3)}s`),
                hovertemplate: '%{text}<extra></extra>'
            };

            Plotly.react('main-map', [trace], {
                title: 'Posición de los mensajes',
                autosize: true
            }, {responsive: true});
        }

        function updateStats() {
            const data = filteredData.length > 0 ? filteredData : fullData;
            const total = data.length;
            const attacks = data.filter(d => d.attack_label === "Ataque").length;
            const pct = total > 0 ? ((attacks / total) * 100).toFixed(1) : 0;

            document.getElementById('stats').innerHTML = `
                <div class="text-center"><div class="text-2xl font-bold">${total}</div><div class="text-xs">Mensajes</div></div>
                <div class="text-center"><div class="text-2xl font-bold text-red-500">${pct}%</div><div class="text-xs">Ataques</div></div>
                <div class="text-center"><div class="text-2xl font-bold">${data.length > 0 ? data[0].scenario_type : '-'}</div><div class="text-xs">Escenario</div></div>
            `;
        }

        function updateAttackChart() {
            const data = filteredData.length > 0 ? filteredData : fullData;
            const counts = {};
            data.forEach(d => counts[d.attack_type] = (counts[d.attack_type] || 0) + 1);

            Plotly.react('attack-chart', [{
                x: Object.keys(counts),
                y: Object.values(counts),
                type: 'bar',
                marker: { color: '#0ea5e9' }
            }], { title: 'Por Tipo de Ataque', autosize: true });
        }

        function populateVehicleSelector() {
            const select = document.getElementById('sender-select');
            const senders = [...new Set(fullData.map(d => d.sender))].slice(0, 60);
            senders.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                select.appendChild(opt);
            });
        }

        function showTrajectory() {
            const sender = document.getElementById('sender-select').value;
            if (!sender) return;

            const traj = fullData.filter(d => d.sender === sender).sort((a,b) => a.sendTime - b.sendTime);
            const color = traj[0].attack_label === "Ataque" ? '#E63946' : '#2E86AB';

            Plotly.react('trajectory-chart', [{
                x: traj.map(d => d.pos_x),
                y: traj.map(d => d.pos_y),
                mode: 'lines+markers',
                line: { color: color, width: 2.5 }
            }], { title: `Trayectoria de ${sender}`, autosize: true });
        }

        window.onload = loadData;
    </script>
</body>
</html>
