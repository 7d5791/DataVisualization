<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeReMi Viz | Explorador Interactivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .filter-chip {
            transition: all 0.2s ease;
            cursor: pointer;
            padding: 6px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 9999px;
            font-size: 0.75rem;
            background: white;
        }
        .filter-chip.active {
            background-color: #0ea5e9;
            color: white;
            border-color: #0ea5e9;
        }
    </style>
</head>
<body class="bg-slate-50">

    <div class="max-w-screen-2xl mx-auto px-8 py-6">
        <h1 class="text-3xl font-bold">Explorador de Ataques en VANETs</h1>
        <p class="text-slate-600 mt-1">Usa los filtros para explorar los datos. Todo se actualiza automáticamente.</p>
    </div>

    <!-- FILTROS -->
    <div class="max-w-screen-2xl mx-auto px-8">
        <div class="bg-white border rounded-3xl p-6 mb-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-semibold">Filtros</h3>
                <button onclick="resetFilters()"
                        class="px-4 py-2 text-sm border rounded-2xl hover:bg-slate-100">
                    Resetear filtros
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

                <div>
                    <label class="text-sm font-semibold text-slate-600">Escenario</label>
                    <div id="filter-scenario" class="flex flex-wrap gap-2 mt-2"></div>
                </div>

                <div>
                    <label class="text-sm font-semibold text-slate-600">Densidad</label>
                    <div id="filter-density" class="flex flex-wrap gap-2 mt-2"></div>
                </div>

                <div>
                    <label class="text-sm font-semibold text-slate-600">Tipo de Ataque</label>
                    <div id="filter-attack-type" class="flex flex-wrap gap-2 mt-2 max-h-20 overflow-auto"></div>
                </div>

            </div>
        </div>

        <!-- VISUALIZACIONES -->
        <div class="grid lg:grid-cols-12 gap-6">

            <!-- MAPA -->
            <div class="lg:col-span-7 bg-white border rounded-3xl p-5">
                <h3 class="font-semibold mb-1">Distribución Espacial</h3>
                <p class="text-xs text-slate-500 mb-3">Ubicación de los mensajes. Rojo = Ataque</p>
                <div id="map" style="height: 460px;"></div>
            </div>

            <!-- ESTADÍSTICAS -->
            <div class="lg:col-span-5 bg-white border rounded-3xl p-5">
                <h3 class="font-semibold mb-4">Estadísticas</h3>
                <div id="stats" class="grid grid-cols-3 gap-4"></div>
            </div>

            <!-- GRÁFICO DE ATAQUES -->
            <div class="lg:col-span-5 bg-white border rounded-3xl p-5">
                <h3 class="font-semibold mb-3">Mensajes por Tipo de Ataque</h3>
                <div id="attack-chart" style="height: 260px;"></div>
            </div>

            <!-- TRAYECTORIA -->
            <div class="lg:col-span-7 bg-white border rounded-3xl p-5">
                <h3 class="font-semibold mb-3">Trayectoria de un Vehículo</h3>
                <select id="sender-select" class="w-full border rounded-2xl px-4 py-3 mb-4" onchange="showTrajectory()">
                    <option value="">-- Selecciona un vehículo --</option>
                </select>
                <div id="trajectory" style="height: 320px;"></div>
            </div>

        </div>
    </div>

    <script>
        let fullData = [];
        let filteredData = [];

        async function loadData() {
            const res = await fetch('sample_data.json');
            fullData = await res.json();
            filteredData = [...fullData];

            initFilters();
            updateAllVisualizations();
            populateSenderSelect();
        }

        // Crear chip de filtro
        function createChip(text, type) {
            const chip = document.createElement('div');
            chip.className = `filter-chip active px-3 py-1 text-xs border`;
            chip.textContent = text;
            chip.dataset.type = type;
            chip.dataset.value = text;

            chip.onclick = function() {
                chip.classList.toggle('active');
                if (chip.classList.contains('active')) {
                    chip.style.backgroundColor = '#0ea5e9';
                    chip.style.color = 'white';
                } else {
                    chip.style.backgroundColor = '';
                    chip.style.color = '';
                }
                applyFilters();
            };
            return chip;
        }

        function initFilters() {
            // Escenario
            const scenarioBox = document.getElementById('filter-scenario');
            [...new Set(fullData.map(d => d.scenario_type))].forEach(val => {
                scenarioBox.appendChild(createChip(val, 'scenario_type'));
            });

            // Densidad
            const densityBox = document.getElementById('filter-density');
            [...new Set(fullData.map(d => d.density))].forEach(val => {
                densityBox.appendChild(createChip(val, 'density'));
            });

            // Tipo de Ataque
            const attackBox = document.getElementById('filter-attack-type');
            [...new Set(fullData.map(d => d.attack_type))].forEach(val => {
                attackBox.appendChild(createChip(val, 'attack_type'));
            });
        }

        function applyFilters() {
            const activeChips = document.querySelectorAll('.filter-chip.active');

            let result = fullData;

            // Agrupar chips activos por tipo
            const filters = {};
            activeChips.forEach(chip => {
                const type = chip.dataset.type;
                if (!filters[type]) filters[type] = [];
                filters[type].push(chip.dataset.value);
            });

            // Aplicar filtros
            Object.keys(filters).forEach(type => {
                result = result.filter(item => filters[type].includes(item[type]));
            });

            filteredData = result;
            updateAllVisualizations();
        }

        function resetFilters() {
            document.querySelectorAll('.filter-chip').forEach(chip => {
                chip.classList.add('active');
                chip.style.backgroundColor = '#0ea5e9';
                chip.style.color = 'white';
            });
            filteredData = [...fullData];
            updateAllVisualizations();
        }

        function updateAllVisualizations() {
            createMap();
            updateStats();
            updateAttackChart();
        }

        function createMap() {
            const data = filteredData.length > 0 ? filteredData : fullData;

            const trace = {
                x: data.map(d => d.pos_x),
                y: data.map(d => d.pos_y),
                mode: 'markers',
                type: 'scatter',
                marker: {
                    color: data.map(d => d.attack_label === "Ataque" ? '#E63946' : '#2E86AB'),
                    size: 5,
                    opacity: 0.7
                },
                text: data.map(d => `${d.sender} - ${d.attack_type}`),
                hovertemplate: '%{text}<extra></extra>'
            };

            Plotly.react('map', [trace], {
                title: 'Ubicación de los mensajes',
                autosize: true
            }, {responsive: true});
        }

        function updateStats() {
            const data = filteredData.length > 0 ? filteredData : fullData;
            const total = data.length;
            const attacks = data.filter(d => d.attack_label === "Ataque").length;
            const pct = total > 0 ? ((attacks / total) * 100).toFixed(1) : 0;

            document.getElementById('stats').innerHTML = `
                <div class="text-center"><div class="text-3xl font-bold">${total}</div><div class="text-xs">Mensajes</div></div>
                <div class="text-center"><div class="text-3xl font-bold text-red-500">${pct}%</div><div class="text-xs">Ataques</div></div>
            `;
        }

        function updateAttackChart() {
            const data = filteredData.length > 0 ? filteredData : fullData;
            const counts = {};
            data.forEach(d => counts[d.attack_type] = (counts[d.attack_type] || 0) + 1);

            Plotly.react('attack-chart', [{
                x: Object.keys(counts),
                y: Object.values(counts),
                type: 'bar',
                marker: { color: '#0ea5e9' }
            }], { title: 'Mensajes por Tipo de Ataque', autosize: true });
        }

        function populateSenderSelect() {
            const select = document.getElementById('sender-select');
            const senders = [...new Set(fullData.map(d => d.sender))].slice(0, 60);
            senders.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                select.appendChild(opt);
            });
        }

        function showTrajectory() {
            const sender = document.getElementById('sender-select').value;
            if (!sender) return;

            const traj = fullData.filter(d => d.sender === sender).sort((a,b) => a.sendTime - b.sendTime);
            const color = traj[0].attack_label === "Ataque" ? '#E63946' : '#2E86AB';

            Plotly.react('trajectory', [{
                x: traj.map(d => d.pos_x),
                y: traj.map(d => d.pos_y),
                mode: 'lines+markers',
                line: { color: color, width: 2.5 }
            }], { title: `Trayectoria: ${sender}`, autosize: true });
        }

        window.onload = loadData;
    </script>
</body>
</html>
